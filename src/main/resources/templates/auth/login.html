<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - Shop Management</title>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main style="max-width: 500px; margin: 40px auto; padding: 0 15px;">

    <h1>Đăng nhập</h1>

    <!-- Success message -->
    <div th:if="${successMessage != null}"
         style="padding: 10px; margin-bottom: 15px; border: 1px solid green; color: green;">

        <span th:text="${successMessage}">
            Thành công
        </span>

    </div>


    <!-- Error message -->
    <div th:if="${errorMessage != null}"
         style="padding: 10px; margin-bottom: 15px; border: 1px solid red; color: red;">

        <span th:text="${errorMessage}">
            Đăng nhập thất bại
        </span>

    </div>


    <form th:action="@{/login}"
          method="post">

        <!--
            CSRF token được Spring Security yêu cầu.
        -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">


        <div style="margin-bottom: 15px;">

            <label for="usernameOrEmail">
                Username hoặc Email
            </label>

            <br>

            <input id="usernameOrEmail"
                   name="usernameOrEmail"
                   type="text"
                   required
                   autofocus
                   style="width: 100%; padding: 8px; box-sizing: border-box;">

        </div>


        <div style="margin-bottom: 15px;">

            <label for="password">
                Password
            </label>

            <br>

            <input id="password"
                   name="password"
                   type="password"
                   required
                   style="width: 100%; padding: 8px; box-sizing: border-box;">

        </div>


        <div style="margin-bottom: 15px;">

            <button type="submit">
                Đăng nhập
            </button>

        </div>

    </form>


    <hr>


    <p>
        <a th:href="@{/forgot-password}">
            Quên password?
        </a>
    </p>


    <p>
        Chưa có tài khoản?

        <a th:href="@{/register}">
            Đăng ký ngay
        </a>
    </p>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
