<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Xác thực OTP - Shop Management</title>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main style="max-width: 500px; margin: 40px auto; padding: 0 15px;">

    <h1>Xác thực tài khoản</h1>

    <p>
        Nhập mã OTP 6 chữ số đã được gửi đến email của bạn.
    </p>

    <p>
        OTP có hiệu lực trong 5 phút và tối đa 5 lần thử.
    </p>


    <!-- Success message -->
    <div th:if="${successMessage != null}"
         style="padding: 10px; margin-bottom: 15px; border: 1px solid green; color: green;">

        <span th:text="${successMessage}">
            OTP đã được gửi.
        </span>

    </div>


    <!-- Error message -->
    <div th:if="${errorMessage != null}"
         style="padding: 10px; margin-bottom: 15px; border: 1px solid red; color: red;">

        <span th:text="${errorMessage}">
            OTP không hợp lệ.
        </span>

    </div>


    <!-- Verify OTP -->
    <form th:action="@{/verify-otp}"
          th:object="${verifyOtpDTO}"
          method="post">

        <!-- CSRF -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">


        <!-- Email -->
        <div style="margin-bottom: 15px;">

            <label for="email">
                Email
            </label>

            <br>

            <input id="email"
                   type="email"
                   th:field="*{email}"
                   required
                   style="width: 100%; padding: 8px; box-sizing: border-box;">

            <div th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}"
                 style="color: red; margin-top: 5px;">
            </div>

        </div>


        <!-- OTP -->
        <div style="margin-bottom: 15px;">

            <label for="otp">
                OTP
            </label>

            <br>

            <input id="otp"
                   type="text"
                   th:field="*{otp}"
                   inputmode="numeric"
                   maxlength="6"
                   pattern="[0-9]{6}"
                   autocomplete="one-time-code"
                   placeholder="Nhập 6 chữ số"
                   required
                   style="width: 100%; padding: 8px; box-sizing: border-box;">

            <div th:if="${#fields.hasErrors('otp')}"
                 th:errors="*{otp}"
                 style="color: red; margin-top: 5px;">
            </div>

        </div>


        <!-- Verify -->
        <div style="margin-top: 20px;">

            <button type="submit">
                Xác thực OTP
            </button>

        </div>

    </form>


    <hr style="margin: 25px 0;">


    <!-- Resend OTP -->
    <form th:action="@{/resend-register-otp}"
          method="post">

        <!-- CSRF -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <input type="hidden"
               name="email"
               th:value="${verifyOtpDTO.email}">

        <button type="submit">
            Gửi lại OTP
        </button>

    </form>


    <p style="margin-top: 20px;">

        <a th:href="@{/login}">
            Quay lại đăng nhập
        </a>

    </p>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
