<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký - Shop Management</title>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main style="max-width: 500px; margin: 40px auto; padding: 0 15px;">

    <h1>Đăng ký tài khoản</h1>

    <!-- Error từ AuthService -->
    <div th:if="${errorMessage != null}"
         style="padding: 10px; margin-bottom: 15px; border: 1px solid red; color: red;">

        <span th:text="${errorMessage}">
            Đăng ký thất bại
        </span>

    </div>


    <form th:action="@{/register}"
          th:object="${registerDTO}"
          method="post">

        <!-- CSRF -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">


        <!-- Username -->
        <div style="margin-bottom: 15px;">

            <label for="username">
                Username
            </label>

            <br>

            <input id="username"
                   type="text"
                   th:field="*{username}"
                   required
                   minlength="3"
                   maxlength="100"
                   style="width: 100%; padding: 8px; box-sizing: border-box;">

            <div th:if="${#fields.hasErrors('username')}"
                 style="color: red; margin-top: 5px;">

                <div th:each="error : ${#fields.errors('username')}"
                     th:text="${error}">
                    Username không hợp lệ
                </div>

            </div>

        </div>


        <!-- Email -->
        <div style="margin-bottom: 15px;">

            <label for="email">
                Email
            </label>

            <br>

            <input id="email"
                   type="email"
                   th:field="*{email}"
                   required
                   maxlength="255"
                   style="width: 100%; padding: 8px; box-sizing: border-box;">

            <div th:if="${#fields.hasErrors('email')}"
                 style="color: red; margin-top: 5px;">

                <div th:each="error : ${#fields.errors('email')}"
                     th:text="${error}">
                    Email không hợp lệ
                </div>

            </div>

        </div>


        <!-- Password -->
        <div style="margin-bottom: 15px;">

            <label for="password">
                Password
            </label>

            <br>

            <input id="password"
                   type="password"
                   th:field="*{password}"
                   required
                   minlength="6"
                   maxlength="100"
                   style="width: 100%; padding: 8px; box-sizing: border-box;">

            <div th:if="${#fields.hasErrors('password')}"
                 style="color: red; margin-top: 5px;">

                <div th:each="error : ${#fields.errors('password')}"
                     th:text="${error}">
                    Password không hợp lệ
                </div>

            </div>

        </div>


        <!-- Full name -->
        <div style="margin-bottom: 15px;">

            <label for="fullName">
                Full name
            </label>

            <br>

            <input id="fullName"
                   type="text"
                   th:field="*{fullName}"
                   required
                   maxlength="150"
                   style="width: 100%; padding: 8px; box-sizing: border-box;">

            <div th:if="${#fields.hasErrors('fullName')}"
                 style="color: red; margin-top: 5px;">

                <div th:each="error : ${#fields.errors('fullName')}"
                     th:text="${error}">
                    Full name không hợp lệ
                </div>

            </div>

        </div>


        <!-- Submit -->
        <div style="margin-top: 20px;">

            <button type="submit">
                Đăng ký
            </button>

            <a th:href="@{/login}"
               style="margin-left: 10px;">
                Quay lại đăng nhập
            </a>

        </div>

    </form>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
