<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đặt lại Password - Shop Management</title>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main style="max-width: 500px; margin: 40px auto; padding: 0 15px;">

    <h1>Đặt lại Password</h1>

    <p>
        Nhập email, OTP đã nhận được và password mới.
    </p>

    <p>
        OTP có hiệu lực trong 5 phút và tối đa 5 lần thử.
    </p>


    <!-- Success message -->
    <div th:if="${successMessage != null}"
         style="padding: 10px; margin-bottom: 15px; border: 1px solid green; color: green;">

        <span th:text="${successMessage}">
            Thành công
        </span>

    </div>


    <!-- Error message -->
    <div th:if="${errorMessage != null}"
         style="padding: 10px; margin-bottom: 15px; border: 1px solid red; color: red;">

        <span th:text="${errorMessage}">
            Không thể đặt lại password.
        </span>

    </div>


    <form th:action="@{/reset-password}"
          th:object="${resetPasswordDTO}"
          method="post">

        <!-- CSRF -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">


        <!-- Email -->
        <div style="margin-bottom: 15px;">

            <label for="email">
                Email
            </label>

            <br>

            <input id="email"
                   type="email"
                   th:field="*{email}"
                   autocomplete="email"
                   required
                   style="width: 100%; padding: 8px; box-sizing: border-box;">

            <div th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}"
                 style="color: red; margin-top: 5px;">
            </div>

        </div>


        <!-- OTP -->
        <div style="margin-bottom: 15px;">

            <label for="otp">
                OTP
            </label>

            <br>

            <input id="otp"
                   type="text"
                   th:field="*{otp}"
                   inputmode="numeric"
                   maxlength="6"
                   pattern="[0-9]{6}"
                   autocomplete="one-time-code"
                   placeholder="Nhập 6 chữ số"
                   required
                   style="width: 100%; padding: 8px; box-sizing: border-box;">

            <div th:if="${#fields.hasErrors('otp')}"
                 th:errors="*{otp}"
                 style="color: red; margin-top: 5px;">
            </div>

        </div>


        <!-- New password -->
        <div style="margin-bottom: 15px;">

            <label for="newPassword">
                Password mới
            </label>

            <br>

            <input id="newPassword"
                   type="password"
                   th:field="*{newPassword}"
                   autocomplete="new-password"
                   placeholder="Nhập password mới"
                   required
                   style="width: 100%; padding: 8px; box-sizing: border-box;">

            <div th:if="${#fields.hasErrors('newPassword')}"
                 th:errors="*{newPassword}"
                 style="color: red; margin-top: 5px;">
            </div>

        </div>


        <!-- Submit -->
        <div style="margin-top: 20px;">

            <button type="submit">
                Đặt lại Password
            </button>

        </div>

    </form>


    <hr style="margin: 25px 0;">


    <p>
        <a th:href="@{/login}">
            Quay lại đăng nhập
        </a>
    </p>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
