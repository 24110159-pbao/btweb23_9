<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quên Password - Shop Management</title>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main style="max-width: 500px; margin: 40px auto; padding: 0 15px;">

    <h1>Quên Password</h1>

    <p>
        Nhập email tài khoản của bạn.
        Hệ thống sẽ gửi OTP để đặt lại password.
    </p>


    <!-- Error message -->
    <div th:if="${errorMessage != null}"
         style="padding: 10px; margin-bottom: 15px; border: 1px solid red; color: red;">

        <span th:text="${errorMessage}">
            Không thể gửi OTP.
        </span>

    </div>


    <form th:action="@{/forgot-password}"
          th:object="${forgotPasswordDTO}"
          method="post">

        <!-- CSRF -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">


        <!-- Email -->
        <div style="margin-bottom: 15px;">

            <label for="email">
                Email
            </label>

            <br>

            <input id="email"
                   type="email"
                   th:field="*{email}"
                   autocomplete="email"
                   placeholder="example@gmail.com"
                   required
                   style="width: 100%; padding: 8px; box-sizing: border-box;">

            <div th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}"
                 style="color: red; margin-top: 5px;">
            </div>

        </div>


        <!-- Submit -->
        <div style="margin-top: 20px;">

            <button type="submit">
                Gửi OTP
            </button>

        </div>

    </form>


    <hr style="margin: 25px 0;">


    <p>
        Nhớ password rồi?

        <a th:href="@{/login}">
            Đăng nhập
        </a>
    </p>


    <p>
        Chưa có tài khoản?

        <a th:href="@{/register}">
            Đăng ký
        </a>
    </p>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
