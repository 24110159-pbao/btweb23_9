<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<div th:fragment="header">

    <header style="border-bottom: 1px solid #ddd; padding: 15px 0; margin-bottom: 25px;">

        <div style="max-width: 1100px; margin: 0 auto; padding: 0 15px;">

            <!-- Brand -->
            <div style="display: flex; justify-content: space-between; align-items: center;">

                <div>
                    <a th:href="@{/}"
                       style="font-size: 22px; font-weight: bold; text-decoration: none; color: #222;">
                        Shop Management
                    </a>
                </div>


                <!-- Menu -->
                <nav style="display: flex; gap: 15px; align-items: center;">

                    <a th:href="@{/}">
                        Trang chủ
                    </a>

                    <a th:href="@{/products}"
                       sec:authorize="isAuthenticated()">
                        Products
                    </a>

                    <a th:href="@{/users}"
                       sec:authorize="hasRole('ADMIN')">
                        Users
                    </a>

                </nav>


                <!-- Guest -->
                <div sec:authorize="isAnonymous()"
                     style="display: flex; gap: 10px;">

                    <a th:href="@{/login}">
                        Đăng nhập
                    </a>

                    <a th:href="@{/register}">
                        Đăng ký
                    </a>

                </div>


                <!-- Logged in -->
                <div sec:authorize="isAuthenticated()"
                     style="display: flex; align-items: center; gap: 10px;">

                    <span>
                        Xin chào,
                        <strong sec:authentication="principal.fullName">
                            User
                        </strong>
                    </span>


                    <span sec:authorize="hasRole('ADMIN')"
                          style="font-weight: bold; color: #b00;">
                        ADMIN
                    </span>


                    <span sec:authorize="hasRole('USER')"
                          style="font-weight: bold; color: #06c;">
                        USER
                    </span>


                    <form th:action="@{/logout}"
                          method="post"
                          style="display: inline;">

                        <button type="submit">
                            Đăng xuất
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </header>

</div>

</html>
