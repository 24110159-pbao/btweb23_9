<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${formTitle} + ' - Shop Management'">
        User Form
    </title>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main style="max-width: 700px; margin: 30px auto; padding: 0 15px;">

    <h1 th:text="${formTitle}">
        User Form
    </h1>


    <!-- ===================================================== -->
    <!-- MESSAGE -->
    <!-- ===================================================== -->

    <div th:if="${successMessage != null}"
         style="padding: 10px; margin-bottom: 15px; border: 1px solid green; color: green;">

        <span th:text="${successMessage}">
            Thành công
        </span>

    </div>


    <div th:if="${errorMessage != null}"
         style="padding: 10px; margin-bottom: 15px; border: 1px solid red; color: red;">

        <span th:text="${errorMessage}">
            Có lỗi xảy ra
        </span>

    </div>


    <!-- ===================================================== -->
    <!-- FORM -->
    <!-- ===================================================== -->

    <form th:object="${userDTO}"
          th:action="${userDTO.id == null}
                     ? @{/users/create}
                     : @{/users/edit/{id}(id=${userDTO.id})}"
          method="post">


        <!-- CSRF -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">


        <!-- ================================================= -->
        <!-- USERNAME -->
        <!-- ================================================= -->

        <div style="margin-bottom: 15px;">

            <label for="username">
                Username:
            </label>

            <br>

            <input id="username"
                   type="text"
                   th:field="*{username}"
                   maxlength="100"
                   required
                   style="width: 100%; padding: 8px; box-sizing: border-box;">

            <div th:if="${#fields.hasErrors('username')}"
                 style="color: red; margin-top: 5px;">

                <span th:errors="*{username}">
                    Username error
                </span>

            </div>

        </div>


        <!-- ================================================= -->
        <!-- EMAIL -->
        <!-- ================================================= -->

        <div style="margin-bottom: 15px;">

            <label for="email">
                Email:
            </label>

            <br>

            <input id="email"
                   type="email"
                   th:field="*{email}"
                   maxlength="255"
                   required
                   style="width: 100%; padding: 8px; box-sizing: border-box;">

            <div th:if="${#fields.hasErrors('email')}"
                 style="color: red; margin-top: 5px;">

                <span th:errors="*{email}">
                    Email error
                </span>

            </div>

        </div>


        <!-- ================================================= -->
        <!-- FULL NAME -->
        <!-- ================================================= -->

        <div style="margin-bottom: 15px;">

            <label for="fullName">
                Full name:
            </label>

            <br>

            <input id="fullName"
                   type="text"
                   th:field="*{fullName}"
                   maxlength="150"
                   required
                   style="width: 100%; padding: 8px; box-sizing: border-box;">

            <div th:if="${#fields.hasErrors('fullName')}"
                 style="color: red; margin-top: 5px;">

                <span th:errors="*{fullName}">
                    Full name error
                </span>

            </div>

        </div>


        <!-- ================================================= -->
        <!-- ROLE -->
        <!-- ================================================= -->

        <div style="margin-bottom: 15px;">

            <label for="role">
                Role:
            </label>

            <br>

            <select id="role"
                    th:field="*{role}"
                    required
                    style="width: 100%; padding: 8px; box-sizing: border-box;">

                <option value="">
                    -- Chọn Role --
                </option>

                <option value="ROLE_USER">
                    ROLE_USER
                </option>

                <option value="ROLE_ADMIN">
                    ROLE_ADMIN
                </option>

            </select>

            <div th:if="${#fields.hasErrors('role')}"
                 style="color: red; margin-top: 5px;">

                <span th:errors="*{role}">
                    Role error
                </span>

            </div>

        </div>


        <!-- ================================================= -->
        <!-- ENABLED -->
        <!-- ================================================= -->

        <div style="margin-bottom: 20px;">

            <label>

                <input type="checkbox"
                       th:field="*{enabled}">

                Tài khoản đang hoạt động

            </label>

        </div>


        <!-- ================================================= -->
        <!-- CREATE MODE INFORMATION -->
        <!-- ================================================= -->

        <div th:if="${userDTO.id == null}"
             style="padding: 10px; margin-bottom: 20px; border: 1px solid #999;">

            <strong>Lưu ý:</strong>

            <p style="margin-bottom: 0;">

                User được tạo bởi Admin sẽ có password mặc định:

                <strong>123456</strong>

            </p>

        </div>


        <!-- ================================================= -->
        <!-- BUTTONS -->
        <!-- ================================================= -->

        <div>

            <button type="submit">
                <span th:text="${userDTO.id == null ? 'Tạo User' : 'Lưu thay đổi'}">
                    Lưu
                </span>
            </button>


            <a th:href="@{/users}"
               style="margin-left: 10px;">

                Quay lại

            </a>

        </div>

    </form>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
