spring.application.name=shop-management

server.port=8080

# =========================================================
# .env
# =========================================================

spring.config.import=optional:file:.env[.properties]


# =========================================================
# MySQL
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/webst5?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / Hibernate
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

spring.jpa.open-in-view=false


# =========================================================
# Thymeleaf
# =========================================================

spring.thymeleaf.prefix=classpath:/templates/

spring.thymeleaf.suffix=.html

spring.thymeleaf.mode=HTML

spring.thymeleaf.encoding=UTF-8

spring.thymeleaf.cache=false


# =========================================================
# Gmail SMTP
# =========================================================

spring.mail.host=smtp.gmail.com

spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}

spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000

spring.mail.properties.mail.smtp.timeout=5000

spring.mail.properties.mail.smtp.writetimeout=5000


# =========================================================
# Cloudinary
# =========================================================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}

cloudinary.api-key=${CLOUDINARY_API_KEY}

cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# =========================================================
# Multipart File Upload
# =========================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================================================
# Application OTP configuration
# =========================================================

app.otp.expiration-minutes=5

app.otp.max-attempts=5

app.otp.length=6


# =========================================================
# Application
# =========================================================

app.default-admin.username=admin

app.default-admin.email=${ADMIN_EMAIL:admin@example.com}

app.default-admin.password=${ADMIN_PASSWORD:123456}

app.default-admin.full-name=Administrator
